{% extends 'products/base.html' %} {% block content %}

<style>
  .form-card {
    border: none;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(15, 27, 45, 0.07);
    max-width: 720px;
    margin: 0 auto;
  }

  .form-card .card-header {
    background: var(--navy);
    color: #fff;
    padding: 1.1rem 1.6rem;
    border: none;
  }

  .form-card .card-header h2 {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
  }

  .form-card .card-body {
    padding: 2rem;
  }

  .form-card label {
    color: var(--navy);
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 6px;
  }

  .form-card input,
  .form-card select,
  .form-card textarea {
    border-radius: 10px !important;
    border: 1.5px solid #e3e7ed !important;
    padding: 10px 14px !important;
    font-size: 14.5px !important;
  }

  .form-card input:focus,
  .form-card select:focus,
  .form-card textarea:focus {
    border-color: var(--blue) !important;
    box-shadow: 0 0 0 3px var(--blue-light) !important;
  }

  .btn-save {
    background: var(--blue);
    border: none;
    color: #fff;
    font-weight: 700;
    padding: 10px 28px;
    border-radius: 10px;
  }

  .btn-save:hover {
    background: var(--blue-dark);
    color: #fff;
  }
</style>

<div class="card form-card">
  <div class="card-header">
    <h2>إضافة منتج جديد</h2>
  </div>

  <div class="card-body">
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %} {% for field in form %}
      <div class="mb-3">
        <label class="form-label"> {{ field.label }} </label>

        {{ field }} {% if field.errors %}
        <div class="text-danger small mt-1">{{ field.errors }}</div>
        {% endif %}
      </div>
      {% endfor %}

      <div class="mb-4">
        <h5 class="mb-3">المقاسات والسعر لكل مقاس</h5>
        <div id="size-container">
          <div class="row g-2 size-row mb-2">
            <div class="col-md-4">
              <input type="text" name="size_name" class="form-control" placeholder="اسم المقاس" />
            </div>
            <div class="col-md-4">
              <input type="number" step="0.01" min="0" name="size_price" class="form-control" placeholder="سعر المقاس" />
            </div>
            <div class="col-md-3">
              <input type="number" min="0" name="size_stock" class="form-control" placeholder="المخزون" />
            </div>
            <div class="col-md-1 text-end">
              <button type="button" class="btn btn-outline-danger btn-sm remove-size">حذف</button>
            </div>
          </div>
        </div>
        <button type="button" id="add-size-btn" class="btn btn-outline-primary btn-sm mt-2">إضافة مقاس</button>
      </div>

      <button type="submit" class="btn btn-save">حفظ المنتج</button>
    </form>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const container = document.getElementById('size-container');
    const button = document.getElementById('add-size-btn');

    button.addEventListener('click', function () {
      const row = document.createElement('div');
      row.className = 'row g-2 size-row mb-2';
      row.innerHTML = `
        <div class="col-md-4"><input type="text" name="size_name" class="form-control" placeholder="اسم المقاس" /></div>
        <div class="col-md-4"><input type="number" step="0.01" min="0" name="size_price" class="form-control" placeholder="سعر المقاس" /></div>
        <div class="col-md-3"><input type="number" min="0" name="size_stock" class="form-control" placeholder="المخزون" /></div>
        <div class="col-md-1 text-end"><button type="button" class="btn btn-outline-danger btn-sm remove-size">حذف</button></div>
      `;
      container.appendChild(row);
      row.querySelector('.remove-size').addEventListener('click', function () {
        row.remove();
      });
    });

    document.querySelectorAll('.remove-size').forEach(function (button) {
      button.addEventListener('click', function () {
        button.closest('.size-row').remove();
      });
    });
  });
</script>

{% endblock %}
