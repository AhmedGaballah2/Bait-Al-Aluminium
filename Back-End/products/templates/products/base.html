<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />

    <title>{% block title %}بيت الألومنيوم{% endblock %}</title>
  </head>

  <body class="bg-light">
    <div class="dashboard-shell d-flex min-vh-100">
      <aside class="dashboard-sidebar bg-white border-end shadow-sm">
        <div class="sidebar-brand px-4 py-4 border-bottom">
          <h4 class="mb-0">بيت الألومنيوم</h4>
          <small class="text-muted">لوحة التحكم</small>
        </div>

        <nav class="sidebar-nav px-3 py-4">
          <a
            class="sidebar-link {% if active_page == 'products' %}active{% endif %}"
            href="{% url 'products:dashboard_products' %}"
          >
            المنتجات
          </a>
          <a
            class="sidebar-link {% if active_page == 'new_arrivals' %}active{% endif %}"
            href="{% url 'products:dashboard_new_arrivals' %}"
          >
            الجديد
          </a>
          <a
            class="sidebar-link {% if active_page == 'offers' %}active{% endif %}"
            href="{% url 'products:dashboard_offers' %}"
          >
            العروض
          </a>
          <a
            class="sidebar-link {% if active_page == 'reviews' %}active{% endif %}"
            href="{% url 'products:dashboard_reviews' %}"
          >
            التقييمات
          </a>
          <a
            class="sidebar-link {% if active_page == 'orders' %}active{% endif %}"
            href="{% url 'products:dashboard_orders' %}"
          >
            الطلبات
          </a>
        </nav>
      </aside>

      <main class="dashboard-main flex-grow-1">
        <header
          class="dashboard-header bg-white border-bottom py-3 px-4 shadow-sm"
        >
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h1 class="h5 mb-0">
                {% block page_title %}لوحة التحكم{% endblock %}
              </h1>
              <p class="text-muted mb-0">
                إدارة المنتجات، الجديد، العروض، والتقييمات.
              </p>
            </div>
            {% if user.is_authenticated %}
            <div class="text-end">
              <div class="small text-muted">مسجل باسم</div>
              <div class="fw-semibold">{{ user.username }}</div>
              <a
                href="{% url 'products:logout' %}"
                class="btn btn-sm btn-outline-danger mt-2"
                >تسجيل خروج</a
              >
            </div>
            {% endif %}
          </div>
        </header>

        <section class="dashboard-content p-4">
          {% block content %}{% endblock %}
        </section>
      </main>
    </div>

    <style>
      body {
        min-height: 100vh;
      }
      .dashboard-shell {
        overflow: hidden;
      }
      .dashboard-sidebar {
        width: 260px;
        min-height: 100vh;
      }
      .sidebar-brand {
        background: #f8f9fa;
      }
      .sidebar-nav {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .sidebar-link {
        display: block;
        padding: 0.95rem 1.25rem;
        color: #495057;
        border-radius: 0.5rem;
        text-decoration: none;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      .sidebar-link:hover,
      .sidebar-link.active {
        background: #e9ecef;
        color: #212529;
      }
      .dashboard-main {
        overflow-x: hidden;
      }
      .dashboard-header {
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .dashboard-content {
        min-height: calc(100vh - 92px);
      }
      .list-table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }
      .list-table th,
      .list-table td {
        padding: 0.95rem 1rem;
        border-bottom: 1px solid #dee2e6;
        vertical-align: middle;
      }
      .list-table th {
        background: #f8f9fa;
        text-align: left;
        font-weight: 600;
      }
      .clickable-row {
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .clickable-row:hover {
        background: #f1f3f5;
      }
      .table-actions a,
      .table-actions button {
        margin-right: 0.35rem;
      }
      .search-box {
        max-width: 420px;
      }
      @media (max-width: 992px) {
        .dashboard-shell {
          flex-direction: column;
        }
        .dashboard-sidebar {
          width: 100%;
        }
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll("tr.clickable-row").forEach(function (row) {
          row.addEventListener("click", function (event) {
            if (event.target.closest("a, button, form")) {
              return;
            }
            window.location = this.dataset.href;
          });
        });
      });
    </script>
  </body>
</html>
