{% extends "products/base.html" %}

{% block title %}حذف التصنيف{% endblock %}
{% block page_title %}حذف التصنيف{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h2 class="h5 mb-3">حذف التصنيف</h2>
        <p class="mb-4">هل أنت متأكد أنك تريد حذف التصنيف <strong>{{ category.name }}</strong>؟</p>
        <form method="POST">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">نعم، حذف</button>
            <a href="{% url 'dashboard:dashboard_categories' %}" class="btn btn-outline-secondary">إلغاء</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
