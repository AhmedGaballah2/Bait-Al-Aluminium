{% extends "products/base.html" %}

{% block title %}حذف التصنيف{% endblock %}
{% block page_title %}حذف التصنيف{% endblock %}

{% block content %}
<style>
  .form-card {
    border: none;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(15, 27, 45, 0.07);
  }

  .form-card .card-body {
    padding: 2rem;
  }

  .form-card h2 {
    color: var(--navy);
    font-weight: 700;
    font-size: 18px;
  }

  .warn-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: #fdecec;
    color: #b42318;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 14px;
  }

  .btn-confirm-delete {
    background: #b42318;
    border: none;
    color: #fff;
    font-weight: 700;
    padding: 9px 26px;
    border-radius: 10px;
  }

  .btn-confirm-delete:hover {
    background: #8f1b13;
    color: #fff;
  }

  .btn-cancel {
    background: #fff;
    border: 1.5px solid #e3e7ed;
    color: var(--navy);
    font-weight: 600;
    padding: 9px 20px;
    border-radius: 10px;
  }

  .btn-cancel:hover {
    background: #f4f6f9;
  }
</style>

<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card form-card">
      <div class="card-body">
        <div class="warn-icon">⚠️</div>
        <h2 class="mb-3">حذف التصنيف</h2>
        <p class="mb-4 text-muted">هل أنت متأكد أنك تريد حذف التصنيف <strong style="color: var(--navy)">{{ category.name }}</strong>؟ لا يمكن التراجع عن هذا الإجراء.</p>
        <form method="POST">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-confirm-delete">نعم، حذف</button>
            <a href="{% url 'dashboard:dashboard_categories' %}" class="btn btn-cancel">إلغاء</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
