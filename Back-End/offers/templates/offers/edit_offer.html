{% extends 'products/base.html' %} {% block content %}
<style>
  .form-card {
    border: none;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(15, 27, 45, 0.07);
    max-width: 720px;
    margin: 0 auto;
  }

  .form-card .card-header {
    background: var(--blue);
    color: #fff;
    padding: 1.1rem 1.6rem;
    border: none;
  }

  .form-card .card-header h2 {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
  }

  .form-card .card-body {
    padding: 2rem;
  }

  .form-card label {
    color: var(--navy);
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 6px;
  }

  .form-card input,
  .form-card select,
  .form-card textarea {
    border-radius: 10px !important;
    border: 1.5px solid #e3e7ed !important;
    padding: 10px 14px !important;
    font-size: 14.5px !important;
  }

  .form-card input:focus,
  .form-card select:focus,
  .form-card textarea:focus {
    border-color: var(--blue) !important;
    box-shadow: 0 0 0 3px var(--blue-light) !important;
  }

  .btn-save {
    background: var(--blue);
    border: none;
    color: #fff;
    font-weight: 700;
    padding: 10px 28px;
    border-radius: 10px;
  }

  .btn-save:hover {
    background: var(--blue-dark);
    color: #fff;
  }
</style>

<div class="card form-card">
  <div class="card-header">
    <h2>تعديل العرض</h2>
  </div>
  <div class="card-body">
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label"> {{ field.label }} </label>
        {{ field }}
        {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors }}</div>{% endif %}
      </div>
      {% endfor %}
      <button type="submit" class="btn btn-save">حفظ التعديلات</button>
    </form>
  </div>
</div>
{% endblock %}
