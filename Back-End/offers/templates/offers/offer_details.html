{% extends 'products/base.html' %} {% block content %}
<style>
  .detail-card {
    border: none;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(15, 27, 45, 0.07);
  }

  .detail-header {
    background: var(--navy);
    color: #fff;
    padding: 1.1rem 1.6rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .detail-header h2 {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
  }

  .btn-edit-outline {
    background: var(--blue);
    border: none;
    color: #fff;
    font-weight: 600;
  }

  .btn-edit-outline:hover {
    background: var(--blue-dark);
    color: #fff;
  }

  .btn-delete-outline {
    background: rgba(255, 255, 255, 0.12);
    border: none;
    color: #fff;
    font-weight: 600;
  }

  .btn-delete-outline:hover {
    background: #b42318;
    color: #fff;
  }

  .detail-list .list-group-item {
    border-color: #eef1f5;
    padding: 0.85rem 0;
    font-size: 15px;
  }

  .detail-list strong {
    color: var(--navy);
    font-weight: 700;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 1.5px solid #e3e7ed;
    color: var(--navy);
    font-weight: 600;
    font-size: 13.5px;
    border-radius: 10px;
    padding: 8px 16px;
    text-decoration: none;
    margin-bottom: 10px;
  }

  .back-link:hover {
    background: var(--blue-light);
    color: var(--blue-dark);
  }
</style>

<div class="container py-4">
  <a href="{% url 'offers:dashboard_offers' %}" class="back-link">&larr; العودة إلى العروض</a>
  <div class="card detail-card">
    <div class="detail-header">
      <h2>{{ offer.title }}</h2>
      <div class="d-flex gap-2">
        <a href="{% url 'offers:edit_offer' offer.id %}" class="btn btn-sm btn-edit-outline">تعديل</a>
        <form method="POST" action="{% url 'offers:delete_offer' offer.id %}" onsubmit="return confirm('هل أنت متأكد من حذف العرض؟');">
          {% csrf_token %}
          <button type="submit" class="btn btn-sm btn-delete-outline">حذف</button>
        </form>
      </div>
    </div>

    <div class="card-body p-4">
      <div class="row g-4 align-items-center">
        <div class="col-md-5">
          <img src="{{ offer.image.url }}" class="img-fluid rounded-4 shadow-sm w-100" style="height: 350px; object-fit: cover" alt="{{ offer.title }}" />
        </div>
        <div class="col-md-7">
          <ul class="list-group list-group-flush detail-list">
            <li class="list-group-item"><strong>السعر الحالي:</strong> <span class="text-success fw-bold">{{ offer.price }} جنيه</span></li>
            <li class="list-group-item"><strong>تاريخ الإضافة:</strong> {{ offer.created_at }}</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
