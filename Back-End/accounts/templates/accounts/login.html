{% load static %}
<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>تسجيل الدخول</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #0f1b2d;
        --blue: #1a67d2;
        --blue-dark: #14509f;
        --blue-light: #eaf2fd;
        --text-muted: #6b7280;
      }

      * {
        font-family: "Cairo", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(180deg, var(--navy) 0%, var(--navy) 220px, #f4f6f9 220px);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .top-strip {
        height: 8px;
        width: 100%;
        background: var(--navy);
      }

      .login-wrapper {
        width: 100%;
        max-width: 420px;
        margin-top: 70px;
        padding: 0 16px;
      }

      .brand {
        text-align: center;
        margin-bottom: 24px;
      }

      .brand-icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        margin-bottom: 10px;
      }

      .brand-title {
        color: #fff;
        font-weight: 800;
        font-size: 22px;
        margin: 0;
      }

      .brand-sub {
        color: #c7d2e0;
        font-size: 13px;
        margin-top: 2px;
      }

      .login-card {
        background: #fff;
        border-radius: 18px;
        padding: 36px 32px;
        box-shadow: 0 20px 45px rgba(15, 27, 45, 0.12);
        border: 1px solid #eef1f5;
      }

      .login-card h3 {
        font-weight: 700;
        font-size: 20px;
        color: var(--navy);
        margin-bottom: 4px;
      }

      .login-card .subtitle {
        color: var(--text-muted);
        font-size: 13.5px;
        margin-bottom: 26px;
      }

      .form-label-sm {
        font-size: 13px;
        font-weight: 600;
        color: var(--navy);
        margin-bottom: 6px;
        display: block;
      }

      .form-control {
        border-radius: 10px;
        border: 1.5px solid #e3e7ed;
        padding: 11px 14px;
        font-size: 14.5px;
        background: #fafbfc;
      }

      .form-control:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px var(--blue-light);
        background: #fff;
      }

      .btn-login {
        background: var(--blue);
        border: none;
        border-radius: 10px;
        padding: 12px;
        font-weight: 700;
        font-size: 15px;
        color: #fff;
        width: 100%;
        transition: background 0.15s ease;
      }

      .btn-login:hover {
        background: var(--blue-dark);
        color: #fff;
      }

      .alert-danger {
        border-radius: 10px;
        font-size: 13.5px;
        border: none;
        background: #fdecec;
        color: #b42318;
      }

      .footer-note {
        text-align: center;
        color: #9aa4b2;
        font-size: 12.5px;
        margin: 22px 0 40px;
      }
    </style>
  </head>
  <body>
    <div class="login-wrapper">
      <div class="brand">
        <div class="brand-icon"><img class="w-100" src="{% static 'logo/logo-vertical.png' %}" alt=""></div>
        <p class="brand-title">بيت الألومنيوم</p>
        <p class="brand-sub">لوحة تحكم الإدارة</p>
      </div>

      <div class="login-card">
        <h3>تسجيل الدخول</h3>
        <p class="subtitle">أدخل بياناتك للوصول إلى لوحة التحكم</p>

        {% if error %}
        <div class="alert alert-danger py-2 mb-3">{{ error }}</div>
        {% endif %}

        <form method="POST">
          {% csrf_token %}
          <label class="form-label-sm">اسم المستخدم</label>
          <input
            type="text"
            name="username"
            class="form-control mb-3"
            placeholder="ادخل اسم المستخدم"
          />

          <label class="form-label-sm">كلمة المرور</label>
          <input
            type="password"
            name="password"
            class="form-control mb-4"
            placeholder="ادخل كلمة المرور"
          />

          <button type="submit" class="btn-login">دخول</button>
        </form>
      </div>

      <p class="footer-note">© 2026 بيت الألومنيوم — جميع الحقوق محفوظة</p>
    </div>
  </body>
</html>
