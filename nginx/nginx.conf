# نغير اسم الدومين ده لدومينك الحقيقي
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 20M;

    # ملفات static بتاعة Django (admin, DRF browsable API, إلخ)
    location /static/ {
        alias /app/staticfiles/;
    }

    # ملفات media (صور المنتجات مثلاً)
    location /media/ {
        alias /app/media/;
    }

    # أي request على /api/ أو /admin/ يروح للباك إند
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # كل حاجة تانية تروح للفرونت إند (React build)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------------
# لما يبقى عندك SSL certificate (مثلاً من Let's Encrypt عن طريق certbot)
# هتضيف server block تاني زي ده وتحول الأول ده لـ redirect بس:
#
# server {
#     listen 443 ssl;
#     server_name yourdomain.com www.yourdomain.com;
#
#     ssl_certificate /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#
#     ... نفس الـ locations اللي فوق
# }
#
# server {
#     listen 80;
#     server_name yourdomain.com www.yourdomain.com;
#     return 301 https://$host$request_uri;
